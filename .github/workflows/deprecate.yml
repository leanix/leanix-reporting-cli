name: Deprecate NPM Version

on:
  workflow_dispatch:
    inputs:
      version:
        description: Version or glob pattern to deprecate (e.g. 1.0.0-beta.10 or 1.0.0-beta.*)
        required: true
      message:
        description: Deprecation message shown to users (leave empty to un-deprecate)
        required: true

jobs:
  deprecate:
    name: Deprecate
    runs-on: ubuntu-latest

    steps:
      - uses: actions/setup-node@v4
        with:
          node-version: lts/*
          registry-url: 'https://registry.npmjs.org'

      - name: Get credentials
        uses: leanix/secrets-action@aacfa4c7ee16d986785566b34b7a9a5a76b5bae3 # master
        with:
          secret-store-credentials: ${{ secrets.INJECTED_SECRET_STORE_CREDENTIALS }}
          required-secrets: |
            NPM_TOKEN

      - name: Deprecate
        run: npm deprecate "@leanix/reporting-cli@${{ inputs.version }}" "${{ inputs.message }}"
        env:
          NODE_AUTH_TOKEN: ${{ env.NPM_TOKEN }}
